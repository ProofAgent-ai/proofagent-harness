[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "proofagent-harness"
dynamic = ["version"]
description = "pytest + observability infrastructure for AI agents. Evaluate the agents you build: multi-turn adversarial red teaming and artifact grading with jury based scoring. Observe the agents you use: intelligent risk screening and intent trajectories for coding agents (Claude Code, Cursor). LLM agnostic."
readme = "README.md"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.10"
authors = [
    { name = "Dr. Fouad Bousetouane" },
    { email = "proofagent.ai@gmail.com" },
]
maintainers = [
    { name = "ProofAI LLC" },
    { email = "proofagent.ai@gmail.com" },
]
keywords = [
    "ai-agents",
    "agent-evaluation",
    "llm-evaluation",
    "ai-testing",
    "test-harness",
    "adversarial-testing",
    "multi-turn-evaluation",
    "ai-safety",
    "hallucination-detection",
    "agent-observability",
    "coding-agents",
    "red-teaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "litellm>=1.50.0",
    "pydantic>=2.0",
    "python-frontmatter>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.0",
    "pyyaml>=6.0",
    # v0.5.0 — Live Reporting POSTs to the dashboard backend over HTTPS.
    # Lightweight, sync + async support, used as the LiveReporter HTTP
    # client. Kept in base deps so `live_reporting=True` works on a vanilla
    # `pip install proofagent-harness` (no extra opt-in required).
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
    "pre-commit>=3.0",
    "build>=1.0",
    "twine>=5.0",
]
# v0.5.0 — Artifact-mode extras for non-Markdown formats. PDFs, Word docs,
# HTML pages, and images all need their own parser. Keep these OPTIONAL so
# users who only score Markdown / code / plain text don't pull in heavy
# dependencies. Install: `pip install proofagent-harness[artifact]`.
artifact = [
    "pypdf>=4.0",              # .pdf → text
    "python-docx>=0.8.11",     # .docx → text
    "beautifulsoup4>=4.11",    # .html → text
    "Pillow>=9.0",             # image preflight (size, mode) before vision-LLM
    "nbformat>=5.0",           # .ipynb → text
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://proofagent.ai/harness"
Documentation = "https://proofagent.ai/harness/docs"
Repository = "https://github.com/ProofAgent-ai/proofagent-harness"
Issues = "https://github.com/ProofAgent-ai/proofagent-harness/issues"
Changelog = "https://github.com/ProofAgent-ai/proofagent-harness/blob/main/CHANGELOG.md"

[project.scripts]
proof = "proofagent_harness.cli:app"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/proofagent_harness"]
include = ["src/proofagent_harness/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]
# Intentional typography in juror prompts / docstrings: en-dash, ×, − (minus).
allowed-confusables = ["–", "×", "−"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
