  # ── Agent security crosswalk ─────────────────────────────────────────────────
  #
  # PROVENANCE. Every id and title below was read from the primary document, not
  # from a vendor mapping page or a blog:
  #
  #   owasp_asi      Top 10 for Agentic Applications, Version 2026 (Dec 2025)
  #                  https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  #   owasp_threats  Agentic AI - Threats and Mitigations, Version 1.1 (Dec 2025)
  #                  https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
  #   owasp_llm      Top 10 for LLM Applications 2025 (published 17 Nov 2024)
  #                  https://genai.owasp.org/resource/owasp-top-10-for-llm-applications-2025/
  #   aiuc_1         AIUC-1, 15 July 2026 release  https://www.aiuc-1.com/
  #   nist_800_53    SP 800-53 Rev. 5, from the official OSCAL catalog
  #                  https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
  #
  # TWO CORRECTIONS WORTH KNOWING, since most published mappings get them wrong:
  #   * The OWASP threat taxonomy is T1..T17 as of v1.1. T16 (Insecure Inter-Agent
  #     Protocol Abuse) and T17 (Supply Chain Compromise) were added after v1.0.
  #     Anything still citing "T1-T15" is mapping a superseded version.
  #   * owasp_asi and owasp_threats are SEPARATE publications with SEPARATE
  #     numbering. The Top 10 cross-references the taxonomy (ASI01 corresponds to
  #     T06 and T07), so the two must not be conflated or deduplicated.
  #
  # WHAT IS MISSING, AND WHY. A control appears here only if an adversarial
  # transcript can produce evidence about it. Controls that need artefacts this
  # harness never sees are omitted rather than listed and left empty:
  #
  #   owasp_asi      omits ASI04 (agentic supply chain) and ASI07 (insecure
  #                  inter-agent communication)      -> 8 of 10
  #   owasp_threats  omits T4 (resource overload), T12, T13, T14 (multi-agent),
  #                  T16 (MCP/A2A protocol), T17 (supply chain)  -> 11 of 17
  #   owasp_llm      omits LLM03 (supply chain), LLM04 (training-data poisoning),
  #                  LLM10 (unbounded consumption)   -> 7 of 10
  #   aiuc_1         21 of 51 active requirements. The remainder are process and
  #                  organisational controls (vendor due diligence, quality
  #                  management, incident plans) that a behavioural run cannot
  #                  speak to, plus A007 (IP violations).
  #   nist_800_53    11 controls, not the catalog. Chosen because an agent
  #                  transcript is direct evidence for them; the surrounding
  #                  programme controls (CA-7, AU-11, retention, review cadence)
  #                  are the organisation's to evidence, not the agent's.
  #
  # Read a framework's coverage as "what a transcript proves", never as
  # certification against the standard.

  owasp_asi:
