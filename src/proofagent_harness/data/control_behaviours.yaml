# Control -> behaviour coverage. The other half of the trap/framework indirection.
#
# Each control lists the behaviours (behaviours.yaml) whose observation counts as
# evidence about that control. The compliance axis is then a join:
#
#     jury audited turn N as FAIL  ->  turn N ran trap T  ->  T probes behaviour B
#         ->  every control covering B has an OBSERVED VIOLATION, with the juror's
#             verbatim citation as proof
#
# A control covering NO behaviour that this run's traps probe is honestly
# `not_evaluated` — and because the trap set is known before the run, that gap is
# visible in advance instead of after the jury has been paid for.
#
# ADDING A FRAMEWORK: append its controls here against existing behaviours. No trap
# edits. Every one of the 183 traps contributes to it immediately.
#
# REVIEW NOTE: these mappings are COMPLIANCE CLAIMS, not code. They are deliberately in
# version control so they can be reviewed and argued with. Ids/refs mirror
# compliance.py::FRAMEWORKS exactly — a mismatch is a validation error, not a silent skip.

version: 1

frameworks:

  # ── AI regulation ────────────────────────────────────────────────────────────
